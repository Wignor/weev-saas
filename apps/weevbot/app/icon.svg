<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#7c3aed"/>
  <!-- antenna -->
  <line x1="50" y1="7" x2="50" y2="19" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="50" cy="6" r="4.5" fill="white"/>
  <!-- head -->
  <rect x="14" y="21" width="72" height="46" rx="15" fill="rgba(255,255,255,0.12)" stroke="white" stroke-width="3.2"/>
  <!-- ears -->
  <rect x="6"  y="32" width="8" height="20" rx="4" fill="rgba(255,255,255,0.55)"/>
  <rect x="86" y="32" width="8" height="20" rx="4" fill="rgba(255,255,255,0.55)"/>
  <!-- eyes -->
  <circle cx="36" cy="44" r="8" fill="white"/>
  <circle cx="64" cy="44" r="8" fill="white"/>
  <circle cx="36" cy="44" r="3.5" fill="#7c3aed"/>
  <circle cx="64" cy="44" r="3.5" fill="#7c3aed"/>
  <!-- mouth -->
  <path d="M36 57 Q50 65 64 57" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- speech bubble pointer -->
  <path d="M43 67 L50 78 L57 67Z" fill="rgba(255,255,255,0.75)"/>
</svg>
